<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Signature Generator — CNAT Title</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafc; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  .fi {
    width: 100%; padding: 10px 16px; border: 1px solid #cbd5e1; border-radius: 8px;
    font-size: 14px; transition: all 0.2s; font-family: inherit;
  }
  .fi:focus { outline: none; box-shadow: 0 0 0 2px #f59e0b; border-color: #f59e0b; }
  .card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 24px; }
  .sb {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; background: #fef3c7; color: #b45309;
    border-radius: 50%; font-size: 13px; font-weight: 700; margin-right: 8px;
  }
  .st { font-size: 18px; font-weight: 600; color: #1e293b; margin: 0 0 16px 0; }
  .fl { display: block; font-size: 14px; font-weight: 500; color: #334155; margin-bottom: 4px; }
  .fh { font-size: 12px; color: #94a3b8; margin-top: 4px; }
  @keyframes fadeScaleIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }
  .sig-preview { animation: fadeScaleIn 0.4s ease-out; }
  .dropzone {
    border: 2px dashed #cbd5e1; border-radius: 8px; padding: 20px; text-align: center;
    cursor: pointer; transition: all 0.2s; background: #f8fafc;
  }
  .dropzone:hover, .dropzone.dragover { border-color: #f59e0b; background: #fffbeb; }
  .dropzone img { max-width: 80px; max-height: 80px; border-radius: 4px; object-fit: cover; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useCallback } = React;

function SignatureGenerator() {
  const [formData, setFormData] = useState({
    name: '', title: '', company: '', phone: '', email: '',
    website: '', websiteDisplay: '', iabsUrl: '', licenseNumber: '', photoUrl: ''
  });
  const [copied, setCopied] = useState(false);
  const [dragover, setDragover] = useState(false);
  const sigRef = useRef(null);
  const fileRef = useRef(null);

  const h = useCallback((e) => {
    const { name, value } = e.target;
    setFormData(p => ({ ...p, [name]: value }));
  }, []);

  const handleFile = (file) => {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (e) => setFormData(p => ({ ...p, photoUrl: e.target.result }));
    reader.readAsDataURL(file);
  };

  const onDrop = (e) => {
    e.preventDefault();
    setDragover(false);
    handleFile(e.dataTransfer.files[0]);
  };

  const removePhoto = () => setFormData(p => ({ ...p, photoUrl: '' }));

  const copy = async () => {
    const el = sigRef.current;
    if (!el) return;
    try {
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      if (navigator.clipboard && window.ClipboardItem) {
        await navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([el.innerHTML], { type: 'text/html' }),
          'text/plain': new Blob([el.innerText], { type: 'text/plain' })
        })]);
      } else {
        document.execCommand('copy');
      }
      sel.removeAllRanges();
    } catch { document.execCommand('copy'); }
    setCopied(true);
    setTimeout(() => setCopied(false), 2500);
  };

  const has = formData.name || formData.title || formData.company || formData.phone || formData.email;
  const d = formData;

  return (
    <div style={{ minHeight: '100vh', background: '#f8fafc' }}>
      {/* Header */}
      <div style={{ background: 'linear-gradient(to right, #1e293b, #334155)', color: 'white', padding: '32px 24px' }}>
        <div style={{ maxWidth: '900px', margin: '0 auto' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '8px' }}>
            <svg width="32" height="32" fill="none" stroke="#fbbf24" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            <h1 style={{ fontSize: '24px', fontWeight: 700, margin: 0 }}>Email Signature Generator</h1>
          </div>
          <p style={{ color: '#94a3b8', fontSize: '14px', margin: 0 }}>Create a professional email signature with clickable links — courtesy of CNAT Title</p>
        </div>
      </div>

      <div style={{ maxWidth: '900px', margin: '0 auto', padding: '24px' }}>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(380px, 1fr))', gap: '32px' }}>

          {/* Form */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>

            <div className="card">
              <h2 className="st"><span className="sb">1</span>Your Information</h2>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                <div>
                  <label className="fl">Full Name <span style={{color:'#ef4444'}}>*</span></label>
                  <input className="fi" name="name" value={d.name} onChange={h} placeholder="Jane Smith" />
                </div>
                <div>
                  <label className="fl">Title</label>
                  <input className="fi" name="title" value={d.title} onChange={h} placeholder="REALTOR® | Buyer Specialist" />
                </div>
                <div>
                  <label className="fl">Company / Brokerage</label>
                  <input className="fi" name="company" value={d.company} onChange={h} placeholder="ABC Realty Group" />
                </div>
                <div>
                  <label className="fl">License Number</label>
                  <input className="fi" name="licenseNumber" value={d.licenseNumber} onChange={h} placeholder="TX #123456" />
                </div>
              </div>
            </div>

            <div className="card">
              <h2 className="st"><span className="sb">2</span>Contact Details</h2>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                <div>
                  <label className="fl">Phone Number</label>
                  <input className="fi" type="tel" name="phone" value={d.phone} onChange={h} placeholder="(817) 555-1234" />
                </div>
                <div>
                  <label className="fl">Email Address</label>
                  <input className="fi" type="email" name="email" value={d.email} onChange={h} placeholder="jane@abcrealty.com" />
                </div>
                <div>
                  <label className="fl">Website URL</label>
                  <input className="fi" type="url" name="website" value={d.website} onChange={h} placeholder="https://www.janesmith.com" />
                </div>
                <div>
                  <label className="fl">Website Display Text <span style={{color:'#94a3b8', fontWeight:400}}>(optional)</span></label>
                  <input className="fi" name="websiteDisplay" value={d.websiteDisplay} onChange={h} placeholder="www.janesmith.com" />
                  <p className="fh">What text should appear for your website link?</p>
                </div>
              </div>
            </div>

            <div className="card">
              <h2 className="st"><span className="sb">3</span>Photo & Disclosures</h2>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                <div>
                  <label className="fl">Headshot / Photo</label>
                  {d.photoUrl ? (
                    <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                      <img src={d.photoUrl} alt="Preview" style={{ width: '64px', height: '64px', borderRadius: '6px', objectFit: 'cover', border: '1px solid #e2e8f0' }} />
                      <div style={{ flex: 1 }}>
                        <p style={{ fontSize: '13px', color: '#334155', marginBottom: '6px' }}>Photo added</p>
                        <button onClick={removePhoto} style={{
                          padding: '4px 12px', fontSize: '12px', border: '1px solid #fca5a5', background: '#fef2f2',
                          color: '#dc2626', borderRadius: '6px', cursor: 'pointer'
                        }}>Remove</button>
                      </div>
                    </div>
                  ) : (
                    <div>
                      <div
                        className={`dropzone${dragover ? ' dragover' : ''}`}
                        onClick={() => fileRef.current.click()}
                        onDrop={onDrop}
                        onDragOver={(e) => { e.preventDefault(); setDragover(true); }}
                        onDragLeave={() => setDragover(false)}
                      >
                        <input ref={fileRef} type="file" accept="image/*" style={{ display: 'none' }}
                          onChange={(e) => handleFile(e.target.files[0])} />
                        <svg width="32" height="32" fill="none" stroke="#94a3b8" viewBox="0 0 24 24" strokeWidth="1.5" style={{ margin: '0 auto 8px' }}>
                          <path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-8m0 0l-3 3m3-3l3 3M4 16l.586.586a2 2 0 001.414.586h12a2 2 0 001.414-.586L20 16" />
                        </svg>
                        <p style={{ fontSize: '13px', color: '#64748b', margin: 0 }}>
                          <strong>Click to upload</strong> or drag & drop
                        </p>
                        <p style={{ fontSize: '11px', color: '#94a3b8', marginTop: '4px' }}>JPG, PNG, or WebP</p>
                      </div>
                      <p className="fh" style={{ marginTop: '8px' }}>Or paste a URL below:</p>
                      <input className="fi" type="url" name="photoUrl" value={d.photoUrl} onChange={h}
                        placeholder="https://example.com/your-photo.jpg" style={{ marginTop: '4px' }} />
                    </div>
                  )}
                </div>
                <div>
                  <label className="fl">IABS Link <span style={{color:'#ef4444'}}>*</span></label>
                  <input className="fi" type="url" name="iabsUrl" value={d.iabsUrl} onChange={h} placeholder="https://www.trec.texas.gov/forms/information-about-brokerage-services" />
                  <p className="fh">Texas law requires this link. Get yours from your broker or use TREC's default form.</p>
                </div>
              </div>
            </div>
          </div>

          {/* Preview */}
          <div>
            <div className="card" style={{ position: 'sticky', top: '24px' }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '16px' }}>
                <h2 style={{ fontSize: '18px', fontWeight: 600, color: '#1e293b', margin: 0 }}>Live Preview</h2>
                <button onClick={copy} disabled={!has}
                  style={{
                    padding: '10px 20px', borderRadius: '8px', fontWeight: 600, fontSize: '14px', border: 'none',
                    cursor: has ? 'pointer' : 'not-allowed',
                    background: copied ? '#22c55e' : has ? '#f59e0b' : '#e2e8f0',
                    color: copied || has ? 'white' : '#94a3b8',
                    transition: 'all 0.2s', display: 'flex', alignItems: 'center', gap: '8px'
                  }}>
                  {copied ? '✓ Copied!' : '📋 Copy Signature'}
                </button>
              </div>

              <div style={{ border: '2px dashed #e2e8f0', borderRadius: '8px', padding: '24px', background: '#f8fafc', minHeight: '180px' }}>
                {has ? (
                  <div ref={sigRef} className="sig-preview" key={d.name + d.title + d.company} style={{ fontFamily: 'Arial, sans-serif', fontSize: '14px', lineHeight: 1.5, color: '#333' }}>
                    <table cellPadding="0" cellSpacing="0" style={{ borderCollapse: 'collapse' }}><tbody><tr>
                      {d.photoUrl && <td style={{ paddingRight: '15px', verticalAlign: 'top' }}>
                        <img src={d.photoUrl} alt={d.name} style={{ width: '80px', height: '80px', borderRadius: '4px', objectFit: 'cover' }} onError={e => e.target.style.display='none'} />
                      </td>}
                      <td style={{ verticalAlign: 'top' }}>
                        {d.name && <div style={{ fontWeight: 'bold', fontSize: '16px', color: '#1a1a1a', marginBottom: '2px' }}>{d.name}</div>}
                        {d.title && <div style={{ color: '#555', marginBottom: '2px' }}>{d.title}</div>}
                        {d.company && <div style={{ color: '#555', marginBottom: '2px' }}>{d.company}</div>}
                        {d.licenseNumber && <div style={{ color: '#777', fontSize: '12px', marginBottom: '8px' }}>{d.licenseNumber}</div>}
                        <div style={{ borderTop: '1px solid #ddd', paddingTop: '8px', marginTop: '4px' }}>
                          {d.phone && <div style={{ marginBottom: '2px' }}><a href={`tel:${d.phone.replace(/\D/g,'')}`} style={{ color: '#2563eb', textDecoration: 'none' }}>{d.phone}</a></div>}
                          {d.email && <div style={{ marginBottom: '2px' }}><a href={`mailto:${d.email}`} style={{ color: '#2563eb', textDecoration: 'none' }}>{d.email}</a></div>}
                          {d.website && <div style={{ marginBottom: '2px' }}><a href={d.website} style={{ color: '#2563eb', textDecoration: 'none' }}>{d.websiteDisplay || d.website.replace(/^https?:\/\//, '')}</a></div>}
                        </div>
                        {d.iabsUrl && <div style={{ marginTop: '10px', paddingTop: '8px', borderTop: '1px solid #ddd' }}>
                          <a href={d.iabsUrl} style={{ color: '#666', textDecoration: 'underline', fontSize: '12px' }}>Information About Brokerage Services</a>
                        </div>}
                      </td>
                    </tr></tbody></table>
                  </div>
                ) : (
                  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', color: '#94a3b8', padding: '32px 0' }}>
                    <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="1.5" style={{ opacity: 0.5, marginBottom: '12px' }}><path strokeLinecap="round" strokeLinejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                    <p style={{ fontSize: '14px', margin: 0 }}>Start typing to see your signature</p>
                  </div>
                )}
              </div>

              <div style={{ marginTop: '20px', padding: '16px', background: '#eff6ff', borderRadius: '8px', border: '1px solid #dbeafe' }}>
                <h3 style={{ fontWeight: 600, color: '#1e3a5f', fontSize: '14px', margin: '0 0 8px 0' }}>📋 How to Use</h3>
                <div style={{ fontSize: '14px', color: '#1e40af', lineHeight: 1.8 }}>
                  <b>1.</b> Fill in your information &nbsp;→&nbsp; <b>2.</b> Click "Copy Signature" &nbsp;→&nbsp; <b>3.</b> Open your email settings → Signature &nbsp;→&nbsp; <b>4.</b> Paste (Ctrl+V / Cmd+V)
                </div>
              </div>

              <div style={{ marginTop: '12px', padding: '16px', background: '#fffbeb', borderRadius: '8px', border: '1px solid #fef3c7' }}>
                <h3 style={{ fontWeight: 600, color: '#78350f', fontSize: '14px', margin: '0 0 4px 0' }}>⚠️ Important</h3>
                <p style={{ fontSize: '14px', color: '#92400e', margin: 0 }}>
                  For best results, paste your signature using a <strong>desktop/laptop</strong> email app or webmail. Mobile apps have limited formatting support.
                </p>
              </div>
            </div>
          </div>
        </div>

        <div style={{ marginTop: '40px', textAlign: 'center', fontSize: '14px', color: '#94a3b8', borderTop: '1px solid #e2e8f0', paddingTop: '24px' }}>
          A free tool from <strong>CNAT Title</strong> • Questions? Contact your escrow officer
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(React.createElement(SignatureGenerator), document.getElementById('root'));
</script>
</body>
</html>
